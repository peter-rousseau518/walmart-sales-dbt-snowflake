version: 2

sources:
  - name: walmart
    description: >
      Bronze layer. Each environment reads its own RAW schema
      (WALMART_DEV, WALMART_STAGING or WALMART_PROD), typed by the load contract.
    database: "{{ target.database }}"
    schema: RAW
    tables:
      # Freshness: weekly files are expected; warn if nothing new has loaded for 8 days.
      # Run with: dbt source freshness (the refresh workflow runs it before every build)
      - name: department
        config:
          loaded_at_field: _loaded_at
          freshness:
            warn_after: {count: 8, period: day}
      - name: stores          # changes rarely, so no freshness check
      - name: fact
        config:
          loaded_at_field: _loaded_at
          freshness:
            warn_after: {count: 8, period: day}
